name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build Web (LITE - Voice Disabled)
        run: |
          npm run build
          echo "Patching voice error for APK..."
          # Inject fetch blocker biar gak manggil /api/realtime/token
          for f in dist/assets/*.js; do
            sed -i 's|/api/realtime/token|/api/disabled|g' "$f" || true
          done
          # Inject CSS + JS biar error box hilang
          sed -i 's|</head>|<style>.voice-system-error,#voice-error{display:none!important}</style><script>window.fetch=(orig=>async(...a)=>{let u=(a[0]||"").toString();if(u.includes("realtime")||u.includes("openai")) return new Response(JSON.stringify({}),{status:200}); return orig(...a)})(window.fetch);</script></head>|' dist/index.html

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap init GodsEye com.godseye.app --web-dir=dist
          npx cap add android
          npx cap copy android
      - name: Fix Duplicate Kotlin
        run: |
          echo "
          configurations.implementation {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }" >> android/app/build.gradle
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GodsEye-APK-LITE
          path: android/app/build/outputs/apk/debug/app-debug.apk
